<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" fill="none">
  <style>
    .name{font:700 56px 'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif;letter-spacing:12px;fill:#fafafa;animation:in 1.6s cubic-bezier(.16,1,.3,1) .1s both}
    .sub{font:13px ui-monospace,'SF Mono',Consolas,Menlo,monospace;letter-spacing:5px;fill:#8a8a8a;animation:up 1.2s cubic-bezier(.16,1,.3,1) .9s both}
    @keyframes in{from{opacity:0;letter-spacing:36px;filter:blur(10px)}to{opacity:1;letter-spacing:12px;filter:blur(0)}}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="200" rx="16" fill="#0a0a0a"/>
  <text class="name" x="506" y="106" text-anchor="middle">AZBYTEX</text>
  <text class="sub" x="502" y="146" text-anchor="middle">FRONTEND DEVELOPER</text>
</svg>
